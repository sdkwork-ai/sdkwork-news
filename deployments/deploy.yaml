version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: news.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
      - domain: news.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
      - domain: news.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
      - domain: news.noaper.com
        tls: noaper.com
        mode: web+api
        web: adaptive
