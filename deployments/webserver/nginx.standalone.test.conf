# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/news/webserver.pid;
error_log /var/log/sdkwork/news/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name news-test.sdkwork.com news-test.birdcoder.com news-test.dtupay.com news-test.sdkwork.cn news-test.birdcoder.cn news-test.dtupay.cn news-test.skubc.com news-test.skubc.cn news-test.zowalk.com news-test.zowalk.cn news-test.offer86.com news-test.offer86.cn news-test.86offer.com news-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
